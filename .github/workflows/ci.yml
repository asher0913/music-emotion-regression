name: Notebook validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate JSON and Python cells
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("notebooks/music_emotion_regression.ipynb")
          notebook = json.loads(path.read_text())
          for index, cell in enumerate(notebook["cells"]):
              if cell.get("cell_type") == "code":
                  compile("".join(cell.get("source", [])), f"cell-{index}", "exec")
          print(f"Validated {len(notebook['cells'])} notebook cells")
          PY
